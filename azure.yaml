# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: contoso-travel-concierge
metadata:
  template: agent-optimization-workshop@1.0.0
requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
infra:
  provider: bicep
  path: infra
  module: main
services:
  # Hosted agent (Lab 05). Deployed with `azd deploy contoso-travel-concierge`
  # into the Foundry project provisioned by infra/. Requires hosted-agent
  # hosting to be enabled first (see labs/fundamentals/05-deploy-hosted-agent.md):
  #   azd env set ENABLE_HOSTED_AGENTS true && azd provision
  contoso-travel-concierge:
    project: src
    host: azure.ai.agent
    language: python
    kind: hosted
    name: contoso-travel-concierge
    description: Contoso Travel Concierge — an Agent Framework orchestrator that delegates to Flight, Hotel, and Car Rental specialist agents.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "0.25"
        memory: 0.5Gi
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    protocols:
      - protocol: responses
        version: 2.0.0
